[package]
name = "paprika-vdagent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Standalone Wayland SPICE clipboard bridge for Linux guests"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.39", features = ["derive", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
wl-clipboard-rs = "0.9.3"

