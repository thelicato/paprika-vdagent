[package]
name = "paprika-vdagent"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Standalone X11 and Wayland SPICE clipboard and file-transfer bridge for Linux guests"
readme = "README.md"

[package.metadata.deb]
depends = "$auto"
section = "utils"
priority = "optional"
maintainer = "Angelo Delicato <thelicato@duck.com>"
copyright = "thelicato"
extended-description = """\
paprika-vdagent is a standalone X11 and Wayland clipboard and file-transfer bridge for
SPICE/QEMU guests. It owns the SPICE virtio guest-agent channel directly and
integrates with wlroots-style Wayland compositors without relying on X11
clipboard mirroring.
"""
assets = [
  ["target/release/paprika-vdagent", "usr/bin/paprika-vdagent", "755"],
  ["packaging/systemd/user/paprika-vdagent.service", "usr/lib/systemd/user/paprika-vdagent.service", "644"],
  ["README.md", "usr/share/doc/paprika-vdagent/README.md", "644"],
  ["docs/testing.md", "usr/share/doc/paprika-vdagent/testing.md", "644"],
  ["docs/setup.md", "usr/share/doc/paprika-vdagent/setup.md", "644"],
  ["docs/architecture.md", "usr/share/doc/paprika-vdagent/architecture.md", "644"],
  ["LICENSE", "usr/share/doc/paprika-vdagent/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/paprika-vdagent", dest = "/usr/bin/paprika-vdagent", mode = "0755" },
  { source = "packaging/systemd/user/paprika-vdagent.service", dest = "/usr/lib/systemd/user/paprika-vdagent.service", mode = "0644" },
  { source = "README.md", dest = "/usr/share/doc/paprika-vdagent/README.md", mode = "0644", doc = true },
  { source = "docs/testing.md", dest = "/usr/share/doc/paprika-vdagent/testing.md", mode = "0644", doc = true },
  { source = "docs/setup.md", dest = "/usr/share/doc/paprika-vdagent/setup.md", mode = "0644", doc = true },
  { source = "docs/architecture.md", dest = "/usr/share/doc/paprika-vdagent/architecture.md", mode = "0644", doc = true },
  { source = "LICENSE", dest = "/usr/share/licenses/paprika-vdagent/LICENSE", mode = "0644", doc = true },
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.39", features = ["derive", "env"] }
rustix = { version = "1.1.4", features = ["fs", "event", "pipe"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wl-clipboard-rs = "0.9.3"
x11rb = { version = "0.14.0", features = ["xfixes"] }

[dev-dependencies]
rustix = { version = "1.1.4", features = ["pipe", "pty", "termios", "process"] }
